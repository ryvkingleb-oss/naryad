name: MVD blank check
on:
  schedule:
    - cron: "0 6 1,15 * *"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-mvd.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mvd-check
          path: reports/
