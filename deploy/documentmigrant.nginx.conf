# Not used on this host. Port 80 belongs to the existing Caddy container.
# Enabling this site would fight Caddy. Public routing is deploy/documentmigrant.caddy.

server {
    listen 80;
    listen [::]:80;
    server_name documentmigrant.ru www.documentmigrant.ru;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
